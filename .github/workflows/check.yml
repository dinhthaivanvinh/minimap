# Checks every pull request and push to main. Cloudflare Workers Builds does the deploying.
name: Check

on:
  push:
    branches: [main]
  pull_request:

# Pull requests from forks run untrusted code, so the job only gets to read the repository.
# Keep it on `pull_request` (never `pull_request_target`), which gives forks no secrets.
permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
